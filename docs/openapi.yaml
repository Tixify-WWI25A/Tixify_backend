# Mit KI erstellt (KI-Log Nr. 8), vom Team geprüft.
openapi: 3.0.3
info:
  title: Tixify gateway und identity-Service
  version: 1.0.0
  description: |
    Das gateway ist die **einzige Adresse**, die die Frontends (MPA und SPA) kennen.

    | Pfad | Ziel | Spezifikation |
    |---|---|---|
    | `/api/auth/*`, `/api/users/*` | identity (in diesem Repo) | dieses Dokument |
    | `/api/events/*`, `/api/geocode`, `/graphql` | catalog-Service | `tixify-catalog/docs/openapi.yaml` |
    | `/api/cart/*`, `/api/orders/*`, `/api/tickets/*` | orders-Service | `tixify-orders/docs/openapi.yaml` |
    | `/internal/*` | **nirgendwohin** (404) | – |

    Weitergeleitete Anfragen behalten Pfad, Body und `Authorization`-Header. Jede Antwort trägt eine
    `X-Request-Id`, die auch an die Services weitergegeben wird (Fehlersuche über alle Logs).

    `GET /api/events*` ohne Login wird 30 Sekunden im gateway zwischengespeichert (Header `X-Cache: HIT|MISS`).
    Jede erfolgreiche Änderung am catalog leert den Zwischenspeicher sofort.

    Ist ein Service nicht erreichbar, antwortet das gateway mit **502**.
    Fehler haben das Format `{ "error": "...", "details": { ... } }`.

servers:
  - url: https://tixify-c7a903638236.herokuapp.com
    description: Produktion (Heroku-App tixify)
  - url: http://localhost:3000
    description: lokal

tags:
  - name: Anmeldung
  - name: Benutzer
  - name: Betrieb

paths:
  /api/auth/register:
    post:
      tags: [Anmeldung]
      summary: Konto anlegen (Rolle customer); verschickt asynchron eine Willkommensmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string, minLength: 2, maxLength: 50, description: "Alternativ als `name` (altes Frontend)" }
                email: { type: string, format: email, description: "Wird kleingeschrieben gespeichert" }
                password: { type: string, minLength: 8, description: "8 Zeichen bis 72 Bytes" }
      responses:
        '201':
          description: Konto angelegt
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/Invalid' }
        '409': { description: E-Mail bereits registriert, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/auth/login:
    post:
      tags: [Anmeldung]
      summary: Anmelden und Token erhalten (gültig 1 Stunde)
      description: "Höchstens 10 Versuche pro IP in 15 Minuten. Unbekannte E-Mail und falsches Passwort ergeben dieselbe Antwort."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Angemeldet
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  token: { type: string, description: "JWT (HS256) mit userId, email, role" }
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { description: Ungültige Anmeldedaten, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: Zu viele Versuche, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/users/me:
    get:
      tags: [Benutzer]
      summary: Eigene, aktuelle Nutzerdaten
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Nutzer, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Konto existiert nicht mehr, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/users:
    get:
      tags: [Benutzer]
      summary: Alle Nutzer (nur Admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Nutzerliste
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/users/{id}/role:
    patch:
      tags: [Benutzer]
      summary: Rolle ändern (nur Admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200': { description: Geändert, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Nutzer nicht gefunden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Eigene Admin-Rechte können nicht entzogen werden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/users/{id}:
    delete:
      tags: [Benutzer]
      summary: Nutzer löschen (nur Admin, nicht sich selbst)
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '204': { description: Gelöscht }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Nutzer nicht gefunden, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Eigenes Konto, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /health:
    get:
      tags: [Betrieb]
      summary: Zustand von gateway, catalog und orders
      responses:
        '200':
          description: Alles erreichbar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Mindestens ein Service nicht erreichbar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  schemas:
    Role:
      type: string
      enum: [customer, organizer, admin]
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        created_at: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        details: { type: object, additionalProperties: { type: string } }
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string }
        upstreams:
          type: object
          properties:
            catalog: { type: string, enum: [ok, error, unreachable] }
            orders: { type: string, enum: [ok, error, unreachable] }
        cache:
          type: object
          properties:
            entries: { type: integer }
            hits: { type: integer }
            misses: { type: integer }

  responses:
    Invalid:
      description: Ungültige Eingaben
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Nicht angemeldet oder Token abgelaufen
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Keine Administratorrechte
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
